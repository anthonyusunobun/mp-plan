<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP Plan - V28 Full Screen + Profiles</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#070B14;color:#fff;min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;background:#111827;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1F2937}
.topbar h1{margin:0;font-size:22px} .topbar h1 span{color:#FBBF24}
.container{max-width:900px;margin:0 auto;padding:14px;padding-bottom:80px}
.card{background:#111827;width:100%;border-radius:18px;padding:20px;border:1px solid #1F2937;margin-bottom:12px}
h1{margin:0;font-size:26px} h1 span{color:#FBBF24} p.sub{color:#9CA3AF;margin:4px 0 14px;font-size:13px}
.tabs{display:flex;background:#070B14;border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;background:transparent;color:#9CA3AF;padding:11px;border-radius:10px;font-size:14px;border:0;cursor:pointer}
.tabs button.active{background:#FBBF24;color:#000;font-weight:800}
.wrap{position:relative;margin-bottom:10px}
.wrap input{width:100%;padding:13px 44px 13px 13px;border-radius:12px;border:1px solid #374151;background:#070B14;color:#fff;font-size:15px;outline:none;margin:0}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #374151;background:#070B14;color:#fff;margin-bottom:10px;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#FBBF24}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#FBBF24;color:#000;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px}
button.secondary{background:#374151;color:#fff} button.green{background:#22C55E;color:#000} button.small{width:auto;padding:8px 14px;font-size:13px;margin:0}
button.blue{background:#60A5FA;color:#000}
.link{color:#FBBF24;text-align:center;margin-top:12px;cursor:pointer;font-size:14px}
.msg{padding:11px;border-radius:12px;font-size:14px;margin-bottom:10px;display:none}
.msg.ok{background:#14532D;display:block}.msg.err{background:#7F1D1D;display:block}.msg.info{background:#1E40AF;display:block}
.hidden{display:none!important}
.badge{background:#FBBF24;color:#000;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.box{margin-top:12px;background:#070B14;padding:15px;border-radius:14px;border:1px solid #1F2937}
.box h3{margin:0 0 8px;font-size:16px}.box label{font-size:12px;color:#9CA3AF}
.nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;position:sticky;top:57px;z-index:9;background:#070B14;padding:8px 0}
.nav button{flex:1;padding:11px 4px;font-size:13px;background:#111827;color:#9CA3AF;min-width:70px;border:1px solid #1F2937}
.nav button.active{background:#FBBF24;color:#000}
.avatar{width:76px;height:76px;border-radius:50%;background:#FBBF24;color:#000;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;margin:0 auto 8px}
.avatar.small{width:44px;height:44px;font-size:18px;margin:0}
.avatar.big{width:90px;height:90px;font-size:36px}
.planCard{background:#1F2937;padding:16px;border-radius:14px;margin-bottom:12px;border-left:4px solid #FBBF24}
.planCard h4{margin:0 0 4px;font-size:17px}.planCard p{margin:5px 0;font-size:14px;color:#D1D5DB}.planCard small{color:#9CA3AF}
.progress{height:10px;background:#374151;border-radius:999px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:#22C55E}
.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700}.pill.money{background:#FBBF24;color:#000}.pill.skill{background:#60A5FA;color:#000}.pill.both{background:#A78BFA;color:#000}
.stat{display:flex;gap:8px}.stat div{flex:1;background:#070B14;padding:12px;border-radius:12px;text-align:center;border:1px solid #1F2937}.stat b{font-size:18px;display:block}.stat small{color:#9CA3AF;font-size:11px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#9CA3AF;font-size:16px;cursor:pointer}
.personRow{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px;border-radius:12px;background:#1F2937;margin-bottom:8px}
.personRow:hover{background:#374151}
.cover{height:90px;background:linear-gradient(90deg,#F59E0B,#22C55E,#60A5FA);border-radius:14px;margin:-5px -5px 0}
.profileHead{text-align:center;margin-top:-40px}
.bio{font-size:14px;color:#D1D5DB;line-height:1.6;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal .card{max-width:600px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="authWrap" style="display:flex;justify-content:center;padding:16px">
<div class="card" id="authCard" style="max-width:460px">
<h1>MP <span>Plan</span></h1><p class="sub">Skills + Money = Dreams Achieved Together - V28</p>
<div id="msg" class="msg"></div>
<div id="debugBox" style="font-size:13px;color:#FBBF24;margin-bottom:8px;padding:10px;background:#000;border-radius:8px">Status: Ready</div>
<div class="tabs"><button id="tabEmail" class="active" onclick="switchTab('email')">Email</button><button id="tabPhone" onclick="switchTab('phone')">Phone</button></div>
<div id="loginBox">
<div id="emailLogin"><input id="loginEmail" type="email" placeholder="Email address" value="usunobunanthonynosakhare@gmail.com"><div class="wrap"><input id="loginPass" type="password" placeholder="Password"><button type="button" class="eye" onclick="togglePass('loginPass',this)">EYE</button></div><button onclick="doLogin()">Log In</button></div>
<div id="phoneLogin" class="hidden"><input id="loginPhone" placeholder="Phone e.g. +2348124962372"><div id="recaptcha"></div><button onclick="doSendCode()">Send SMS Code</button><input id="smsCode" placeholder
