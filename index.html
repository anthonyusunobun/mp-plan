<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP Plan - Version 23</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1e293b;width:100%;max-width:430px;border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
h1{margin:0 0 4px;font-size:28px} p.sub{color:#94a3b8;margin:0 0 20px}
.tabs{display:flex;background:#0f172a;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;color:#94a3b8;padding:10px;border-radius:10px;font-size:15px}
.tabs button.active{background:#22c55e;color:#000}
.wrap{position:relative;margin-bottom:12px}
.wrap input{width:100%;padding:13px 44px 13px 13px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:16px;outline:none;margin:0}
.wrap input:focus{border-color:#22c55e}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:12px;font-size:16px;outline:none}
input:focus{border-color:#22c55e}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#94a3b8;font-size:20px;cursor:pointer;width:36px;padding:0}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#22c55e;color:#000;font-weight:800;font-size:16px;cursor:pointer;margin-top:4px}
button.secondary{background:#334155;color:#fff}
.link{color:#22c55e;text-align:center;margin-top:14px;cursor:pointer;font-size:14px}
.msg{padding:12px;border-radius:12px;font-size:14px;margin-bottom:12px;display:none}
.msg.ok{background:#14532d;display:block}.msg.err{background:#7f1d1d;display:block}.msg.info{background:#1e40af;display:block}
.hidden{display:none!important}
.badge{background:#22c55e;color:#000;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center}
.plan{margin-top:16px;background:#0f172a;padding:16px;border-radius:14px}
.plan h3{margin:0 0 8px}.plan label{font-size:13px;color:#cbd5e1}
</style>
</head>
<body>
<div class="card" id="authCard">
<h1>MP Plan</h1>
<p class="sub">Login with Email OR Phone - Version 23</p>
<div id="msg" class="msg"></div>
<div class="tabs"><button id="tabEmail" class="active">Email</button><button id="tabPhone">Phone</button></div>
<div id="loginBox">
<div id="emailLogin">
<input id="loginEmail" type="email" placeholder="Email address">
<div class="wrap"><input id="loginPass" type="password" placeholder="Password"><button type="button" class="eye" onclick="togglePass('loginPass',this)">EYE</button></div>
<button id="loginBtn">Log In with Email</button>
</div>
<div id="phoneLogin" class="hidden">
<input id="loginPhone" placeholder="Phone e.g. +2348124962372">
<div id="recaptcha"></div>
<button id="sendCodeBtn">Send SMS Code</button>
<input id="smsCode" placeholder="Enter 6-digit SMS code" style="margin-top:12px">
<button id="verifyCodeBtn" class="secondary">Verify Code & Log In</button>
</div>
<div class="link" id="toSignup">No account? Create one</div>
<div class="link" id="forgot">Forgot password? (Email only)</div>
</div>
<div id="signupBox" class="hidden">
<input id="suName" placeholder="Full name">
<input id="suEmail" type="email" placeholder="Email address">
<div class="wrap"><input id="suPass" type="password" placeholder="Create password (6+ characters)"><button type="button" class="eye" onclick="togglePass('suPass',this)">EYE</button></div>
<button id="signupBtn">Create Account & Send Verification Email</button>
<div class="link" id="toLogin">Already have account? Log in</div>
</div>
<div id="verifyBox" class="hidden">
<p>We sent a verification link to <b id="verifyEmail"></b></p>
<p style="color:#94a3b8;font-size:14px">Check your inbox + spam. Click the link, then come back.</p>
<button id="checkVerifyBtn">I Verified - Check Now</button>
<button class="secondary" id="resendBtn">Resend Email</button>
<div class="link" id="logout1">Use different account</div>
</div>
</div>
<div class="card hidden" id="appCard">
<div class="row"><div><h1 style="font-size:22px">Welcome</h1><p class="sub" id="userEmail"></p></div><span class="badge">VERIFIED</span></div>
<div class="plan">
<h3>Your MP Plan - Today</h3>
<label>Today's Goal</label><input id="goal" placeholder="e.g. Study 2hrs, Gym, No junk food">
<label>Notes</label><input id="notes" placeholder="How are you feeling today?">
<button id="savePlanBtn">Save My Plan</button>
<p id="savedText" style="font-size:13px;color:#86efac"></p>
</div>
<button class="secondary" id="logoutBtn">Log Out</button>
</div>
<script>
const firebaseConfig = {
apiKey: "AIzaSyCm9n6nern9J2RVg2GcqRxH8_QCJ5FwNAo",
authDomain: "mp-plan-anthony.firebaseapp.com",
projectId: "mp-plan-anthony",
storageBucket: "mp-plan-anthony.firebasestorage.app",
messagingSenderId: "866100401066",
appId: "1:866100401066:web:a0505ef2dae9344b3111d3"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const $ = id => document.getElementById(id);
function togglePass(id,btn){ const el=$(id); el.type = el.type==='password'?'text':'password'; btn.textContent = el.type==='password'?'EYE':'HIDE'; }
function showMsg(t, type){ const m=$('msg'); m.textContent=t; m.className='msg '+type; }
function showBox(which){ ['loginBox','signupBox','verifyBox'].forEach(id=>$(id).classList.add('hidden')); $(which).classList.remove('hidden'); }
$('toSignup').onclick=()=>showBox('signupBox');
$('toLogin').onclick=()=>showBox('loginBox');
$('tabEmail').onclick=()=>{ $('tabEmail').classList.add('active'); $('tabPhone').classList.remove('active'); $('emailLogin').classList.remove('hidden'); $('phoneLogin').classList.add('hidden'); };
$('tabPhone').onclick=()=>{ $('tabPhone').classList.add('active'); $('tabEmail').classList.remove('active'); $('phoneLogin').classList.remove('hidden'); $('emailLogin').classList.add('hidden'); };
$('signupBtn').onclick=async()=>{
const name=$('suName').value.trim(), email=$('suEmail').value.trim(), pass=$('suPass').value;
if(!name||!email||pass.length<6) return showMsg('Fill all fields. Password must be 6+ characters.','err');
try{
const cred=await auth.createUserWithEmailAndPassword(email,pass);
await cred.user.updateProfile({displayName:name});
await cred.user.sendEmailVerification();
$('verifyEmail').textContent=email;
showBox('verifyBox'); showMsg('Account created! Verification email sent. Check inbox.','ok');
}catch(e){ showMsg(e.message,'err'); }
};
$('loginBtn').onclick=async()=>{
try{
const cred=await auth.signInWithEmailAndPassword($('loginEmail').value.trim(), $('loginPass').value);
if(!cred.user.emailVerified){ $('verifyEmail').textContent=cred.user.email; showBox('verifyBox'); return showMsg('Please verify your email first. Check inbox.','info'); }
showApp(cred.user);
}catch(e){ showMsg('Wrong email or password. If you have no account yet, click Create one below.','err'); }
};
let confirmationResult=null;
$('sendCodeBtn').onclick=async()=>{
const phone=$('loginPhone').value.trim();
if(!phone.startsWith('+')) return showMsg('Phone must start with +234... e.g. +2348124962372','err');
try{
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha', {size:'invisible'});
confirmationResult = await auth.signInWithPhoneNumber(phone, window.recaptchaVerifier);
showMsg('SMS code sent to '+phone,'ok');
}catch(e){ showMsg(e.message,'err'); }
};
$('verifyCodeBtn').onclick=async()=>{
try{ const cred=await confirmationResult.confirm($('smsCode').value.trim()); showApp(cred.user); }catch(e){ showMsg('Wrong code. Try again.','err'); }
};
$('checkVerifyBtn').onclick=async()=>{
await auth.currentUser.reload();
if(auth.currentUser.emailVerified) showApp(auth.currentUser);
else showMsg('Not verified yet. Click the link in your email, then try again.','err');
};
$('resendBtn').onclick=async()=>{ try{ await auth.currentUser.sendEmailVerification(); showMsg('Verification email resent!','ok'); }catch(e){ showMsg(e.message,'err'); } };
$('forgot').onclick=async()=>{
const email=$('loginEmail').value.trim(); if(!email) return showMsg('Type your email first, then click Forgot password.','info');
try{ await auth.sendPasswordResetEmail(email); showMsg('Password reset email sent to '+email,'ok'); }catch(e){ showMsg(e.message,'err'); }
};
function showApp(user){
$('authCard').classList.add('hidden'); $('appCard').classList.remove('hidden');
$('userEmail').textContent=(user.displayName||user.phoneNumber||'User')+' - '+(user.email||user.phoneNumber||'');
const saved=localStorage.getItem('mpplan_'+user.uid);
if(saved){ const d=JSON.parse(saved); $('goal').value=d.goal||''; $('notes').value=d.notes||''; $('savedText').textContent='Loaded your last saved plan'; }
}
$('savePlanBtn').onclick=()=>{
const user=auth.currentUser; if(!user) return;
localStorage.setItem('mpplan_'+user.uid, JSON.stringify({goal:$('goal').value, notes:$('notes').value, date:new Date().toISOString()}));
$('savedText').textContent='Saved - '+new Date().toLocaleString();
};
async function doLogout(){ await auth.signOut(); location.reload(); }
$('logoutBtn').onclick=doLogout; $('logout1').onclick=doLogout;
auth.onAuthStateChanged(user=>{
if(user && (user.emailVerified || user.phoneNumber)) showApp(user);
else if(user && !user.emailVerified){ $('verifyEmail').textContent=user.email; showBox('verifyBox'); }
});
</script>
</body>
</html>
