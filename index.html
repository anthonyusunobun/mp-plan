<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP Plan LITE</title><style>body{margin:0;background:#070B14;color:#fff;font-family:system-ui;padding:16px}input{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #374151;background:#111827;color:#fff;font-size:16px}button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:9px;background:#FBBF24;font-weight:800;font-size:16px}.g{background:#22C55E}.r{background:#EF4444;color:#fff}.d{background:#374151;color:#fff}.box{background:#111827;padding:12px;border-radius:10px;margin:9px 0;font-size:14px}.hide{display:none}.plan{background:#1F2937;padding:12px;border-radius:10px;margin:9px 0}</style></head><body>
<div id="login"><h1>MP <span style="color:#FBBF24">Plan</span> LITE</h1><p>You Fund Talent. They Work. Both Gain.<br>Benin City. Admin Approved.</p><input id="em" placeholder="Email with @"><input id="pw" type="password" placeholder="Password"><button onclick="go()">Log In</button><p style="color:#9CA3AF;font-size:13px">If it freezes here, tell me. Don't tap anything else.</p></div>
<div id="app" class="hide"><h2>Hi, <span id="who"></span></h2><button class="d" onclick="show('home')">Home</button><button class="d" onclick="show('admin')">Admin - PIN 2026</button><div id="home"><div id="list"></div><h3>Create Plan - Goes To Admin</h3><input id="tt" placeholder="Plan Title"><input id="ta" type="number" placeholder="Amount"><button class="g" onclick="add()">Send To Admin</button></div><div id="admin" class="hide"><input id="pin" type="password" placeholder="PIN 2026"><button onclick="unlock()">Unlock Admin</button><div id="adminBox"></div></div><button class="d" onclick="out()">Log Out</button></div>
<script>
var plans=[
{title:"Bakery - Need Oven",owner:"Amina",amt:120000,status:"approved"},
{title:"Poultry - 200 Birds",owner:"Chidi",amt:250000,status:"approved"},
{title:"Tailoring - Need Machine",owner:"Grace",amt:80000,status:"approved"}
];
function go(){var e=document.getElementById("em").value;if(!e||e.indexOf("@")==-1){alert("Email must have @");return}document.getElementById("who").textContent=e.split("@")[0];document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");draw();}
function out(){document.getElementById("app").classList.add("hide");document.getElementById("login").classList.remove("hide");document.getElementById("em").value="";}
function show(x){document.getElementById("home").classList.add("hide");document.getElementById("admin").classList.add("hide");document.getElementById(x).classList.remove("hide");}
function draw(){var h="";for(var i=0;i<plans.length;i++){if(plans[i].status!=="approved")continue;h+='<div class="plan"><b>'+plans[i].title+'</b><br>By '+plans[i].owner+' - ₦'+plans[i].amt+'</div>';}document.getElementById("list").innerHTML=h||"No approved plans";}
function add(){var t=document.getElementById("tt").value;var a=document.getElementById("ta").value;if(!t||!a){alert("Fill title + amount");return}plans.push({title:t,owner:"You",amt:a,status:"pending"});alert("Sent to Admin! You will NOT see it on Home until Admin approves.");document.getElementById("tt").value="";document.getElementById("ta").value="";}
function unlock(){if(document.getElementById("pin").value!=="2026"){alert("Wrong PIN");return}var h="<h3>Pending</h3>";for(var i=0;i<plans.length;i++){if(plans[i].status==="pending"){h+='<div class="plan">'+plans[i].title+' - ₦'+plans[i].amt+'<br><button class="g" onclick="ap('+i+')">Approve</button><button class="r" onclick="rj('+i+')">Reject</button></div>';}}h+="<h3>Approved</h3>";for(var j=0;j<plans.length;j++){if(plans[j].status==="approved"){h+='<div class="plan">'+plans[j].title+'</div>';}}document.getElementById("adminBox").innerHTML=h;}
function ap(i){plans[i].status="approved";draw();unlock();alert("Approved!");}
function rj(i){plans[i].status="rejected";draw();unlock();alert("Rejected");}
</script></body></html>
