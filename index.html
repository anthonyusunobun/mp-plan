<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP Plan - Save together. Achieve together.</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{margin:0;background:#0f172a;color:#fff;min-height:100vh}
.hidden{display:none!important}
.top{background:#10b981;padding:18px;text-align:center}
.top h1{margin:0;font-size:26px}
.top p{margin:4px 0 0;opacity:.9}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.card{background:#1e293b;border-radius:16px;padding:18px;margin-bottom:14px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin:8px 0;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#10b981;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}
button.outline{background:transparent;border:1px solid #475569}
button.small{width:auto;padding:8px 14px;font-size:13px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:12px;background:#0f172a;border-radius:99px;overflow:hidden;margin:10px 0}
.fill{height:100%;background:#10b981;width:24%}
.badge{background:#10b981;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.muted{opacity:.7;font-size:13px}
.link{color:#34d399;text-align:center;cursor:pointer;margin-top:12px;font-weight:700}
.logo{font-size:44px;text-align:center}
h2{margin:6px 0}
.plan{border:1px solid #334155}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:20px;user-select:none}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="top"><h1>MP Plan</h1><p>Save together. Achieve together.</p></div>
  <div class="wrap">
    <div class="card">
      <div class="logo">💰</div>
      <h2 style="text-align:center" id="authTitle">Welcome Back</h2>
      <p class="muted" style="text-align:center">Log in to see your plans</p>
      <div id="signupFields" class="hidden">
        <input id="suName" placeholder="Full Name e.g. Anthony Smith">
      </div>
      <input id="authEmail" placeholder="Email or Phone e.g. anthony@gmail.com" type="text">
      <!-- PASSWORD WITH EYE -->
      <div style="position:relative">
        <input id="authPass" placeholder="Password (min 4 chars)" type="password" style="padding-right:50px">
        <span class="eye" onclick="togglePass()" id="eyeIcon">👁️
